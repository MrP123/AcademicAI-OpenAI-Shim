model_list:
  - model_name: aai_claude-opus-4-6
    litellm_params:
      model: openai/claude-opus-4-6 #shim behaves like the OpenAI api --> can use any of the models that the academic AI API provides access to
      api_base: http://localhost:8081/v1
      api_key: dummy #LiteLLM does not do validation for the academic AI API --> handled in the shim
      supports_streaming: false

  - model_name: aai_gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_base: http://localhost:8081/v1
      api_key: dummy
      supports_streaming: false

  - model_name: aai_gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_base: http://localhost:8081/v1
      api_key: dummy
      supports_streaming: false

litellm_settings:
  timeout: 60
  num_retries: 0
  router_health_check: false
  use_responses_api: false
  supports_streaming: false